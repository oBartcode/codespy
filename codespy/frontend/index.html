<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeSpy — GitHub Repository Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080b10;
    --surface: #0d1117;
    --surface2: #161b22;
    --border: #21262d;
    --accent: #00ff88;
    --accent2: #ff6b35;
    --accent3: #7c6dfa;
    --text: #e6edf3;
    --muted: #7d8590;
    --danger: #f85149;
    --warn: #d29922;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid de fundo animado */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Brilho de canto */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(0,255,136,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* ─── HEADER ─── */
  header {
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .logo span { color: var(--accent); }

  /* ─── HERO / SEARCH ─── */
  .hero {
    padding: 80px 0 60px;
    text-align: center;
  }

  .hero-badge {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    border: 1px solid rgba(0,255,136,0.3);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 24px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .hero h1 {
    font-size: clamp(40px, 7vw, 80px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -3px;
    margin-bottom: 20px;
  }

  .hero h1 em {
    font-style: normal;
    color: var(--accent);
    position: relative;
  }

  .hero p {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    max-width: 480px;
    margin: 0 auto 48px;
    line-height: 1.7;
  }

  /* ─── SEARCH BOX ─── */
  .search-wrap {
    max-width: 600px;
    margin: 0 auto;
    position: relative;
  }

  .search-box {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,255,136,0.1);
  }

  .search-prefix {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    padding: 0 16px;
    display: flex;
    align-items: center;
    border-right: 1px solid var(--border);
    background: var(--surface2);
    white-space: nowrap;
  }

  .search-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    padding: 16px 20px;
  }

  .search-input::placeholder { color: var(--muted); }

  .search-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 0 28px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }

  .search-btn:hover { background: #00cc6e; }
  .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .examples {
    margin-top: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .examples button {
    background: none;
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    margin: 4px;
    transition: all 0.15s;
  }

  .examples button:hover {
    border-color: var(--accent);
    background: rgba(0,255,136,0.07);
  }

  /* ─── LOADING ─── */
  .loading {
    display: none;
    text-align: center;
    padding: 80px 0;
  }

  .loading.active { display: block; }

  .loader {
    width: 48px;
    height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 24px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  /* ─── ERROR ─── */
  .error-box {
    display: none;
    background: rgba(248,81,73,0.08);
    border: 1px solid rgba(248,81,73,0.3);
    border-radius: 12px;
    padding: 20px 24px;
    margin: 32px 0;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--danger);
  }

  .error-box.active { display: block; }

  /* ─── RESULTS ─── */
  #results { display: none; padding-bottom: 80px; }
  #results.active { display: block; }

  /* ─── REPO HEADER ─── */
  .repo-header {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    padding: 40px 0 32px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .owner-avatar {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    border: 2px solid var(--border);
    flex-shrink: 0;
  }

  .repo-meta { flex: 1; min-width: 200px; }

  .repo-name {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 8px;
  }

  .repo-name a { color: var(--text); text-decoration: none; }
  .repo-name a:hover { color: var(--accent); }

  .repo-desc {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .topic {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    background: rgba(124,109,250,0.15);
    color: var(--accent3);
    border: 1px solid rgba(124,109,250,0.3);
    padding: 3px 10px;
    border-radius: 20px;
  }

  /* ─── STATS BAR ─── */
  .stats-bar {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .stat-val {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
  }

  .stat-lbl {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* ─── HEALTH SCORE ─── */
  .health-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    display: flex;
    align-items: center;
    gap: 32px;
    margin-top: 32px;
    flex-wrap: wrap;
  }

  .grade-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) 0deg, var(--border) 0deg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .grade-inner {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .grade-letter {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
  }

  .grade-score {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  .health-breakdown { flex: 1; min-width: 200px; }

  .health-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .breakdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .breakdown-label {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    width: 100px;
    flex-shrink: 0;
  }

  .breakdown-bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .breakdown-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 1s ease;
  }

  .breakdown-pts {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text);
    width: 45px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ─── GRID DE CARDS ─── */
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 20px;
    margin-top: 32px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    transition: border-color 0.2s;
  }

  .card:hover { border-color: rgba(0,255,136,0.3); }

  .card-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* Spans do grid */
  .col-4 { grid-column: span 4; }
  .col-5 { grid-column: span 5; }
  .col-6 { grid-column: span 6; }
  .col-7 { grid-column: span 7; }
  .col-8 { grid-column: span 8; }
  .col-12 { grid-column: span 12; }

  @media (max-width: 900px) {
    .col-4, .col-5, .col-6, .col-7, .col-8 { grid-column: span 12; }
  }

  /* ─── LINGUAGENS ─── */
  .lang-bar {
    display: flex;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 20px;
    gap: 2px;
  }

  .lang-segment { transition: flex 1s ease; }

  .lang-list { display: flex; flex-direction: column; gap: 10px; }

  .lang-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .lang-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .lang-name {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    flex: 1;
  }

  .lang-pct {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  /* ─── GRÁFICO DE ATIVIDADE ─── */
  .activity-chart {
    width: 100%;
    height: 100px;
    display: flex;
    align-items: flex-end;
    gap: 4px;
  }

  .activity-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    height: 100%;
    justify-content: flex-end;
  }

  .activity-bar {
    width: 100%;
    background: var(--accent);
    border-radius: 3px 3px 0 0;
    opacity: 0.8;
    min-height: 2px;
    transition: height 1s ease;
  }

  .activity-bar:hover { opacity: 1; }

  .activity-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    height: 28px;
  }

  /* ─── HEATMAP DE HORAS ─── */
  .hour-chart {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 60px;
    width: 100%;
  }

  .hour-bar {
    flex: 1;
    border-radius: 2px 2px 0 0;
    background: var(--accent3);
    opacity: 0.7;
    min-height: 2px;
    cursor: default;
    transition: opacity 0.15s;
    position: relative;
  }

  .hour-bar:hover { opacity: 1; }

  .hour-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  /* ─── CONTRIBUIDORES ─── */
  .contributors-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .contributor {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .contributor img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
  }

  .contributor-info { flex: 1; min-width: 0; }

  .contributor-name {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .contributor-bar-wrap {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }

  .contributor-bar {
    height: 100%;
    background: var(--accent2);
    border-radius: 2px;
  }

  .contributor-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ─── ISSUES ─── */
  .issues-donut-wrap {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .donut-svg { flex-shrink: 0; }

  .issues-legend { display: flex; flex-direction: column; gap: 10px; }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ─── RELEASES ─── */
  .release-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .release-item:last-child { border-bottom: none; }

  .release-tag {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    background: rgba(0,255,136,0.1);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  .release-name {
    font-size: 13px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .release-date {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }

  /* ─── INFO CARD ─── */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .info-item {}

  .info-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .info-val {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }

  /* ─── FOOTER ─── */
  footer {
    border-top: 1px solid var(--border);
    padding: 32px 0;
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    position: relative;
    z-index: 1;
  }

  footer a { color: var(--accent); text-decoration: none; }

  /* ─── ANIMAÇÕES DE ENTRADA ─── */
  .fade-in {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeIn 0.5s ease forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.2s; }
  .delay-3 { animation-delay: 0.3s; }
  .delay-4 { animation-delay: 0.4s; }
  .delay-5 { animation-delay: 0.5s; }
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">🔍</div>
      Code<span>Spy</span>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container">
    <div class="hero-badge">GitHub Intelligence Tool</div>
    <h1>Radiografe qualquer<br><em>repositório</em></h1>
    <p>Análise profunda de atividade, saúde, linguagens, contribuidores e muito mais — em segundos.</p>

    <div class="search-wrap">
      <div class="search-box">
        <span class="search-prefix">github.com/</span>
        <input
          id="search-input"
          class="search-input"
          type="text"
          placeholder="owner/repository"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="search-btn" id="search-btn" onclick="analyze()">Analisar →</button>
      </div>
      <div class="examples">
        Tente:
        <button onclick="setExample('torvalds/linux')">torvalds/linux</button>
        <button onclick="setExample('facebook/react')">facebook/react</button>
        <button onclick="setExample('python/cpython')">python/cpython</button>
        <button onclick="setExample('fastapi/fastapi')">fastapi/fastapi</button>
      </div>
    </div>
  </div>
</section>

<div class="container">
  <div class="loading" id="loading">
    <div class="loader"></div>
    <p id="loading-text">Conectando ao GitHub...</p>
  </div>

  <div class="error-box" id="error-box"></div>

  <div id="results">
    <!-- Preenchido via JS -->
  </div>
</div>

<footer>
  <div class="container">
    Feito com ❤️ e Python · <a href="https://github.com" target="_blank">GitHub API</a> · Open Source
  </div>
</footer>

<script>
const API_BASE = 'http://https://codespy-api-2.onrender.com';
const loadingMessages = [
  'Conectando ao GitHub...',
  'Buscando commits...',
  'Analisando linguagens...',
  'Calculando score de saúde...',
  'Montando relatório...'
];

let loadingInterval;

function setExample(val) {
  document.getElementById('search-input').value = val;
  analyze();
}

document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') analyze();
});

function startLoadingAnimation() {
  let i = 0;
  document.getElementById('loading-text').textContent = loadingMessages[0];
  loadingInterval = setInterval(() => {
    i = (i + 1) % loadingMessages.length;
    document.getElementById('loading-text').textContent = loadingMessages[i];
  }, 1200);
}

function stopLoadingAnimation() {
  clearInterval(loadingInterval);
}

async function analyze() {
  const input = document.getElementById('search-input').value.trim();
  if (!input) return;

  const parts = input.replace('https://github.com/', '').split('/');
  if (parts.length < 2) {
    showError('Formato inválido. Use: owner/repository');
    return;
  }

  const [owner, repo] = parts;

  document.getElementById('loading').classList.add('active');
  document.getElementById('error-box').classList.remove('active');
  document.getElementById('results').classList.remove('active');
  document.getElementById('search-btn').disabled = true;
  startLoadingAnimation();

  try {
    const res = await fetch(`${API_BASE}/api/analyze/${owner}/${repo}`);
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Erro ao buscar dados');
    }
    const data = await res.json();
    renderResults(data);
  } catch (err) {
    showError(err.message);
  } finally {
    document.getElementById('loading').classList.remove('active');
    document.getElementById('search-btn').disabled = false;
    stopLoadingAnimation();
  }
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = `⚠ ${msg}`;
  el.classList.add('active');
  document.getElementById('results').classList.remove('active');
}

function fmt(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return n.toString();
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', { year: 'numeric', month: 'short', day: 'numeric' });
}

function fmtAge(days) {
  if (days >= 365) return `${Math.floor(days/365)} ano(s)`;
  if (days >= 30) return `${Math.floor(days/30)} meses`;
  return `${days} dias`;
}

function gradeColor(g) {
  return { S: '#00ff88', A: '#00cc6e', B: '#7c6dfa', C: '#d29922', D: '#f85149' }[g] || '#7d8590';
}

function renderResults(d) {
  const { repo, languages, activity, commit_hours, contributors, issues, releases, health } = d;

  // Conic gradient do grade
  const gradePct = health.score / 100;
  const gradeAngle = Math.round(gradePct * 360);
  const gc = gradeColor(health.grade);

  // Activity chart
  const maxCommits = Math.max(...activity.map(a => a.commits), 1);
  const activityBars = activity.map(a => {
    const h = Math.round((a.commits / maxCommits) * 80);
    const mo = a.month.slice(5); // MM
    return `
      <div class="activity-bar-wrap" title="${a.month}: ${a.commits} commits">
        <div class="activity-bar" style="height:${h}px"></div>
        <div class="activity-label">${mo}</div>
      </div>`;
  }).join('');

  // Hour chart
  const maxH = Math.max(...commit_hours.map(h => h.count), 1);
  const hourBars = commit_hours.map(h => {
    const pct = Math.round((h.count / maxH) * 54);
    return `<div class="hour-bar" style="height:${pct}px" title="${h.hour}h: ${h.count} commits"></div>`;
  }).join('');

  // Linguagens bar
  const langBar = languages.slice(0, 6).map(l =>
    `<div class="lang-segment" style="flex:${l.percent};background:${l.color}" title="${l.name} ${l.percent}%"></div>`
  ).join('');

  const langList = languages.slice(0, 7).map(l => `
    <div class="lang-item">
      <div class="lang-dot" style="background:${l.color}"></div>
      <span class="lang-name">${l.name}</span>
      <span class="lang-pct">${l.percent}%</span>
    </div>`).join('');

  // Contribuidores
  const maxContribs = contributors.length ? contributors[0].contributions : 1;
  const contribList = contributors.map(c => `
    <div class="contributor">
      <img src="${c.avatar}" alt="${c.login}" loading="lazy">
      <div class="contributor-info">
        <div class="contributor-name">${c.login}</div>
        <div class="contributor-bar-wrap">
          <div class="contributor-bar" style="width:${Math.round(c.contributions/maxContribs*100)}%"></div>
        </div>
      </div>
      <span class="contributor-count">${fmt(c.contributions)}</span>
    </div>`).join('');

  // Issues donut SVG
  const totalIss = issues.open + issues.closed || 1;
  const openPct = issues.open / totalIss;
  const circ = 2 * Math.PI * 28;
  const openDash = openPct * circ;

  const issueDonut = `
    <svg class="donut-svg" width="80" height="80" viewBox="0 0 80 80">
      <circle cx="40" cy="40" r="28" fill="none" stroke="#21262d" stroke-width="10"/>
      <circle cx="40" cy="40" r="28" fill="none" stroke="#f85149" stroke-width="10"
        stroke-dasharray="${openDash} ${circ}" stroke-dashoffset="${circ * 0.25}" stroke-linecap="round"/>
      <circle cx="40" cy="40" r="28" fill="none" stroke="#00ff88" stroke-width="10"
        stroke-dasharray="${circ - openDash} ${circ}" stroke-dashoffset="${circ * 0.25 - openDash}" stroke-linecap="round"/>
      <text x="40" y="44" text-anchor="middle" font-family="Space Mono" font-size="11" fill="#e6edf3">${totalIss}</text>
    </svg>`;

  // Breakdown health
  const breakdown = health.breakdown.map(b => `
    <div class="breakdown-item">
      <span class="breakdown-label">${b.label}</span>
      <div class="breakdown-bar-wrap">
        <div class="breakdown-bar" style="width:${Math.round(b.pts/b.max*100)}%"></div>
      </div>
      <span class="breakdown-pts">${b.pts}/${b.max}</span>
    </div>`).join('');

  // Releases
  const releaseList = releases.length
    ? releases.map(r => `
        <div class="release-item">
          <span class="release-tag">${r.tag}</span>
          <span class="release-name">${r.name}</span>
          <span class="release-date">${fmtDate(r.date)}</span>
        </div>`).join('')
    : '<p style="font-family:Space Mono;font-size:12px;color:var(--muted)">Nenhum release encontrado</p>';

  // Topics
  const topicsHtml = repo.topics.length
    ? repo.topics.map(t => `<span class="topic">${t}</span>`).join('')
    : '';

  document.getElementById('results').innerHTML = `
    <!-- Repo Header -->
    <div class="repo-header fade-in">
      <img class="owner-avatar" src="${repo.owner_avatar}" alt="avatar">
      <div class="repo-meta">
        <div class="repo-name"><a href="${repo.url}" target="_blank">${repo.full_name}</a></div>
        <p class="repo-desc">${repo.description || 'Sem descrição'}</p>
        ${topicsHtml ? `<div class="topics">${topicsHtml}</div>` : ''}
      </div>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar fade-in delay-1" style="padding:28px 0;border-bottom:1px solid var(--border)">
      <div class="stat-item">
        <span class="stat-val">⭐ ${fmt(repo.stars)}</span>
        <span class="stat-lbl">Stars</span>
      </div>
      <div class="stat-item">
        <span class="stat-val">🍴 ${fmt(repo.forks)}</span>
        <span class="stat-lbl">Forks</span>
      </div>
      <div class="stat-item">
        <span class="stat-val">👁 ${fmt(repo.watchers)}</span>
        <span class="stat-lbl">Watchers</span>
      </div>
      <div class="stat-item">
        <span class="stat-val">📁 ${(repo.size/1024).toFixed(1)} MB</span>
        <span class="stat-lbl">Tamanho</span>
      </div>
      <div class="stat-item">
        <span class="stat-val">🕐 ${fmtAge(repo.age_days)}</span>
        <span class="stat-lbl">Idade</span>
      </div>
    </div>

    <!-- Health Score -->
    <div class="health-card fade-in delay-2">
      <div class="grade-circle" style="background:conic-gradient(${gc} ${gradeAngle}deg, #21262d ${gradeAngle}deg)">
        <div class="grade-inner">
          <span class="grade-letter" style="color:${gc}">${health.grade}</span>
          <span class="grade-score">${health.score}/100</span>
        </div>
      </div>
      <div class="health-breakdown">
        <div class="health-title">Score de Saúde do Repositório</div>
        ${breakdown}
      </div>
    </div>

    <!-- Grid principal -->
    <div class="grid">

      <!-- Linguagens -->
      <div class="card col-5 fade-in delay-2">
        <div class="card-title">Linguagens</div>
        <div class="lang-bar">${langBar}</div>
        <div class="lang-list">${langList || '<p style="font-family:Space Mono;font-size:12px;color:var(--muted)">Nenhuma linguagem detectada</p>'}</div>
      </div>

      <!-- Atividade -->
      <div class="card col-7 fade-in delay-3">
        <div class="card-title">Atividade — últimos 12 meses</div>
        <div class="activity-chart">${activityBars}</div>
      </div>

      <!-- Contribuidores -->
      <div class="card col-5 fade-in delay-3">
        <div class="card-title">Top Contribuidores</div>
        <div class="contributors-list">${contribList || '<p style="font-family:Space Mono;font-size:12px;color:var(--muted)">Sem dados</p>'}</div>
      </div>

      <!-- Issues -->
      <div class="card col-4 fade-in delay-4">
        <div class="card-title">Issues</div>
        <div class="issues-donut-wrap">
          ${issueDonut}
          <div class="issues-legend">
            <div class="legend-item">
              <div class="legend-dot" style="background:var(--danger)"></div>
              <span>${issues.open} abertas</span>
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background:var(--accent)"></div>
              <span>${issues.closed} resolvidas</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Horário de commits -->
      <div class="card col-3 fade-in delay-4">
        <div class="card-title">Quando commitam?</div>
        <div class="hour-chart">${hourBars}</div>
        <div class="hour-labels">
          <span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span>
        </div>
      </div>

      <!-- Releases -->
      <div class="card col-6 fade-in delay-4">
        <div class="card-title">Releases</div>
        ${releaseList}
      </div>

      <!-- Info geral -->
      <div class="card col-6 fade-in delay-5">
        <div class="card-title">Detalhes</div>
        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">Branch padrão</div>
            <div class="info-val">${repo.default_branch}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Licença</div>
            <div class="info-val">${repo.license}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Criado em</div>
            <div class="info-val">${fmtDate(repo.created_at)}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Atualizado</div>
            <div class="info-val">${fmtDate(repo.updated_at)}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Open Issues</div>
            <div class="info-val">${fmt(repo.open_issues)}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Tamanho</div>
            <div class="info-val">${(repo.size / 1024).toFixed(2)} MB</div>
          </div>
        </div>
      </div>

    </div>
  `;

  document.getElementById('results').classList.add('active');
  window.scrollTo({ top: document.querySelector('.repo-header').offsetTop - 20, behavior: 'smooth' });
}
</script>
</body>
</html>
